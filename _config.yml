# Site settings
title: Oisin Hott
email: oisin.hott@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Engineering portfolio of Oisin Hott, a mechanical engineer working
  across robotics, mechatronics and embedded systems. Projects include a
  6-DOF robotic arm, ROS2 software and hardware design.
url: "https://oisin-hott.github.io"
baseurl: ""
github_username: oisin-hott
minimal_mistakes_skin: dark
search: true
breadcrumbs: true   
locale: en-IE

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Europe/Dublin

include:
  - _pages

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Oisin Hott"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "Mechanical engineer (MSc, UCD) building robots at the intersection of mechanical design, embedded systems and C++/ROS2."
  location: "Dublin, Ireland"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto: oisin.hott.com"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/oisin-hott-734795291/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/oisin-hott"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/oisin-hott-734795291/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/oisin-hott"

defaults:
  # _posts (only used if you add blog posts later)
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
  # _pages (your project pages)
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
