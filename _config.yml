# Site settings
title: Oisin LASTNAME
email: YOUR-EMAIL@example.com
description: >- # this means to ignore newlines until "baseurl:"
  Engineering portfolio of Oisin LASTNAME, a mechanical engineer working
  across robotics, mechatronics and embedded systems. Projects include a
  6-DOF robotic arm, ROS2 software and hardware design.
url: "https://YOUR-GITHUB-USERNAME.github.io"
baseurl: ""
github_username: YOUR-GITHUB-USERNAME
minimal_mistakes_skin: default # other options: air, aqua, contrast, dark, dirt, mint, neon, plum, sunrise
search: true
locale: en-IE

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Europe/Dublin

include:
  - _pages

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Oisin LASTNAME"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "Mechanical engineer (MSc, UCD) building robots at the intersection of mechanical design, embedded systems and C++/ROS2."
  location: "Dublin, Ireland"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:YOUR-EMAIL@example.com"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/YOUR-LINKEDIN/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/YOUR-GITHUB-USERNAME"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/YOUR-LINKEDIN/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/YOUR-GITHUB-USERNAME"

defaults:
  # _posts (only used if you add blog posts later)
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
  # _pages (your project pages)
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
